workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Regenerate Android files
        script: |
          rm -rf android
          flutter create --org com.gombestore --project-name gombestore --platforms android .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk